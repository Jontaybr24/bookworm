<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bookworm</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Abril+Fatface&family=Cormorant+Garamond:wght@500;600;700&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root {
  --wood-dark: #1e130d;
  --wood: #3a2417;
  --wood-light: #5b3a24;
  --paper: #f4ead3;
  --paper-2: #ebdfc2;
  --paper-edge: #d6c49c;
  --ink: #2a2017;
  --ink-soft: #5d4c3a;
  --brass: #c9a45c;
  --brass-bright: #e8cf8f;
  --oxblood: #7a2e2a;
  --forest: #2f5140;
  --navy: #26375a;
  --danger: #8f2d22;
  --radius: 4px;
  --shadow: 0 10px 30px rgba(0,0,0,.45);
  --serif: 'EB Garamond', Georgia, serif;
  --display: 'Cormorant Garamond', Georgia, serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  min-height: 100vh;
  font-family: var(--serif);
  font-size: 18px;
  color: var(--ink);
  background-color: var(--wood-dark);
  background-image:
    repeating-linear-gradient(90deg, rgba(255,255,255,.012) 0 2px, transparent 2px 9px),
    repeating-linear-gradient(90deg, rgba(0,0,0,.08) 0 1px, transparent 1px 37px),
    radial-gradient(ellipse at 50% -10%, #4a2e1c 0%, var(--wood-dark) 70%);
  background-attachment: fixed;
}
button, input, textarea, select { font: inherit; color: inherit; }
a { color: var(--oxblood); }
[hidden] { display: none !important; }

/* ---------- title: a shelf of books, one letter per spine ---------- */
/* --s scales the whole shelf: full size on the sign-in page, compact beside the menus everywhere else. */
header.top {
  --s: .46;
  max-width: 1280px; margin: 0 auto; padding: 14px 16px 0;
  display: flex; align-items: flex-end; justify-content: space-between; gap: 12px 20px; flex-wrap: wrap;
}
body.auth-mode header.top { --s: 1; flex-direction: column; align-items: center; padding-top: 44px; }
.shelf-title { position: relative; display: inline-flex; flex-direction: column; text-decoration: none; }
.shelf-title h1 { margin: 0; display: flex; align-items: flex-end; gap: calc(3px * var(--s) + 1px); padding: 0 calc(14px * var(--s)); }
.spine {
  --h: 108px; --w: 52px; --c: #7a2e2a; --t: var(--brass-bright);
  --b1: calc(9px * var(--s)); --b2: calc(11px * var(--s)); --b3: calc(15px * var(--s)); --b4: calc(16px * var(--s) + .5px);
  width: calc(var(--w) * var(--s)); height: calc(var(--h) * var(--s));
  display: flex; align-items: center; justify-content: center;
  position: relative;
  background:
    linear-gradient(90deg, rgba(0,0,0,.35), rgba(255,255,255,.10) 28%, rgba(255,255,255,.02) 55%, rgba(0,0,0,.30)),
    var(--c);
  border-radius: 3px 3px 1px 1px;
  box-shadow: inset 0 0 0 1px rgba(0,0,0,.25), 2px 0 3px rgba(0,0,0,.35);
  font-family: 'Abril Fatface', var(--display);
  font-size: calc(var(--w) * var(--s) * .62);
  color: var(--t);
  text-shadow: 0 1px 0 rgba(0,0,0,.35);
  font-weight: 400; line-height: 1;
  transform-origin: bottom left;
}
/* The gilt bands top and bottom are borders, not hard-edged gradients: borders stay smooth on the leaning spine. */
.spine::before, .spine::after {
  content: ''; position: absolute; left: 0; right: 0; box-sizing: border-box; pointer-events: none;
  height: calc(var(--b4) - var(--b1)); border: 0 solid var(--t);
}
.spine::before { top: var(--b1); border-top-width: calc(var(--b2) - var(--b1)); border-bottom-width: calc(var(--b4) - var(--b3)); }
.spine::after { bottom: var(--b1); border-bottom-width: calc(var(--b2) - var(--b1)); border-top-width: calc(var(--b4) - var(--b3)); }
.spine.lean { transform: rotate(5deg) translateX(calc(4px * var(--s))); margin-left: calc(6px * var(--s));
  backface-visibility: hidden; outline: 1px solid transparent; }
.plank {
  height: calc(16px * var(--s) + 3px); margin-top: 0;
  background: linear-gradient(180deg, #7a5131 0%, #5b3a24 45%, #3a2417 100%);
  border-radius: 2px;
  box-shadow: 0 8px 12px -4px rgba(0,0,0,.7), inset 0 1px 0 rgba(255,255,255,.15);
}
.plank::after { content: ''; display: block; height: 5px; margin: calc(16px * var(--s)) 10px 0; background: rgba(0,0,0,.35); filter: blur(4px); }

nav.userbar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; min-width: 0; padding-bottom: 10px; color: var(--paper-2); font-size: 16px; }
/* The row of buttons scrolls sideways inside itself when the screen is too narrow, so it never widens the page. */
nav.userbar .navlinks {
  display: flex; align-items: center; gap: 8px; flex-wrap: nowrap; min-width: 0;
  overflow-x: auto; -webkit-overflow-scrolling: touch; scrollbar-width: thin; scrollbar-color: rgba(232,207,143,.4) transparent;
}
nav.userbar .navlinks > * { flex: none; white-space: nowrap; }
nav.userbar .navlinks .btn:focus-visible { outline-offset: -3px; } /* inside the button: the scroller would clip a ring drawn outside */
.badge { display: inline-block; min-width: 18px; padding: 0 5px; margin-left: 6px; border-radius: 9px; background: var(--oxblood); color: var(--paper); font-family: var(--serif); font-size: 13px; line-height: 18px; text-align: center; }
.invite-strip { margin-bottom: 16px; padding: 14px 16px; border: 1px solid var(--paper-edge); border-left: 4px solid var(--oxblood); background: #fffaf0; border-radius: 3px; }
.invite-strip .list li { border-bottom: 0; }
.checklist { max-height: 300px; overflow: auto; border: 1px solid var(--paper-edge); background: #fffaf0; border-radius: var(--radius); padding: 6px; margin: 10px 0; }
.checklist label { font-family: var(--serif); font-weight: 400; display: flex; gap: 10px; align-items: center; padding: 6px; margin: 0; cursor: pointer; border-radius: 3px; }
.checklist label:hover { background: rgba(0,0,0,.04); }
.checklist input { accent-color: var(--oxblood); width: 17px; height: 17px; }
.checklist .muted { margin-left: auto; font-size: 14px; }
.empty-invite { margin-top: 18px; padding: 16px; border: 2px dashed var(--paper-edge); border-radius: 4px; text-align: center; }
.players .friend-btn { flex: none; }
.friend-btn .short { display: none; }
.players li.compact .friend-btn .full { display: none; }
.players li.compact .friend-btn .short { display: inline; }
.players li.compact .friend-btn { min-width: 28px; padding-left: 6px; padding-right: 6px; font-size: 16px; }
.players li { gap: 8px; }
.shelf-count { flex: none; }
.lib-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 14px; flex-wrap: wrap; margin-bottom: 16px; }
.lib-tools { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.lib-tools input { width: 240px; max-width: 100%; }
.seg { display: inline-flex; border: 1px solid #4a2f1d; border-radius: var(--radius); overflow: hidden; }
.seg button { border: 0; padding: 6px 12px; cursor: pointer; background: #fffaf0; font-family: var(--display); font-weight: 700; font-size: 16px; }
.seg button[aria-pressed=true] { background: linear-gradient(180deg, #6b4429, #4a2f1d); color: var(--paper); }
.archive { border: 1px solid var(--paper-edge); border-left: 4px solid var(--wood-light); background: #fffaf0; border-radius: 3px; padding: 12px 16px; margin-bottom: 10px; }
.archive summary { cursor: pointer; display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; list-style: none; }
.archive summary::-webkit-details-marker { display: none; }
.archive summary::before { content: '▸'; color: var(--ink-soft); transition: transform .15s; }
.archive[open] summary::before { transform: rotate(90deg); }
.archive .a-name { font-family: var(--display); font-weight: 700; font-size: 21px; }
.archive .other { box-shadow: 0 2px 6px rgba(0,0,0,.15), inset 0 0 0 1px var(--paper-edge); }
nav.userbar .who { font-style: italic; margin-right: 6px; }
nav.userbar .role { font-family: var(--display); font-weight: 700; letter-spacing: .06em; text-transform: uppercase; font-size: 13px; color: var(--brass); margin-left: 4px; }

/* ---------- common ---------- */
main { max-width: 1280px; margin: 0 auto; padding: 22px 16px 90px; }
.paper {
  background: linear-gradient(180deg, var(--paper), var(--paper-2));
  border-radius: var(--radius);
  box-shadow: var(--shadow), inset 0 0 0 1px var(--paper-edge);
  padding: 24px;
}
h2, h3 { font-family: var(--display); font-weight: 700; margin: 0 0 12px; line-height: 1.1; }
h2 { font-size: 30px; }
h3 { font-size: 22px; }
.muted { color: var(--ink-soft); }
.small { font-size: 15px; }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  padding: 7px 16px; border-radius: var(--radius); cursor: pointer;
  border: 1px solid #4a2f1d; background: linear-gradient(180deg, #6b4429, #4a2f1d); color: var(--paper);
  font-family: var(--display); font-weight: 700; font-size: 17px; letter-spacing: .02em;
  box-shadow: inset 0 1px 0 rgba(255,255,255,.15), 0 2px 4px rgba(0,0,0,.25);
}
.btn:hover { filter: brightness(1.12); }
.btn:disabled { opacity: .5; cursor: not-allowed; filter: none; }
.btn.primary { background: linear-gradient(180deg, #8e3a33, var(--oxblood)); border-color: #5b211e; }
.btn.green { background: linear-gradient(180deg, #3d6853, var(--forest)); border-color: #1f372b; }
.btn.ghost { background: transparent; color: inherit; border-color: currentColor; box-shadow: none; }
.btn.danger { background: transparent; color: var(--danger); border-color: var(--danger); box-shadow: none; }
.btn.sm { padding: 3px 10px; font-size: 15px; }
nav.userbar .btn.ghost { color: var(--paper-2); }
label { display: block; font-family: var(--display); font-weight: 700; font-size: 17px; margin-bottom: 4px; }
input[type=text], input[type=password], input[type=date], input[type=search], textarea {
  width: 100%; padding: 8px 10px; border-radius: var(--radius);
  border: 1px solid var(--paper-edge); background: #fffaf0; box-shadow: inset 0 1px 2px rgba(0,0,0,.08);
}
input:focus, textarea:focus, .btn:focus-visible, .tile:focus-visible { outline: 2px solid var(--oxblood); outline-offset: 2px; }
.field { margin-bottom: 14px; }
.row { display: flex; gap: 12px; flex-wrap: wrap; }
.row > .field { flex: 1 1 180px; }
.error { color: var(--danger); min-height: 1.3em; font-style: italic; }
.stamp {
  display: inline-block; padding: 1px 8px; border-radius: 3px; font-family: var(--display); font-weight: 700;
  font-size: 13px; letter-spacing: .08em; text-transform: uppercase; border: 1.5px solid currentColor;
}
.stamp.active { color: var(--forest); }
.stamp.upcoming { color: var(--navy); }
.stamp.ended { color: var(--ink-soft); }
.stamp.keeper { color: var(--oxblood); }

/* ---------- auth ---------- */
.auth { max-width: 420px; margin: 30px auto; }
.auth .switch { margin-top: 14px; font-size: 16px; }
.linkish { background: none; border: 0; padding: 0; color: var(--oxblood); text-decoration: underline; cursor: pointer; }

/* ---------- lobby ---------- */
.tabs { display: flex; gap: 4px; padding-left: 12px; }
.tabs button {
  padding: 8px 22px 6px; border: 0; cursor: pointer; border-radius: 8px 8px 0 0;
  font-family: var(--display); font-weight: 700; font-size: 19px;
  background: #cdb98d; color: var(--ink-soft); box-shadow: inset 0 -6px 8px -6px rgba(0,0,0,.3);
}
.tabs button[aria-selected=true] { background: var(--paper); color: var(--ink); box-shadow: none; }
.tabpanel { border-top-left-radius: var(--radius); }
.catalog { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; }
.card-entry {
  text-align: left; cursor: pointer; padding: 14px 16px 12px; border-radius: 3px;
  border: 1px solid var(--paper-edge);
  background:
    linear-gradient(180deg, transparent 30px, #c9d6e3 30px 31px, transparent 31px) top / 100% 100% no-repeat,
    repeating-linear-gradient(180deg, transparent 0 23px, rgba(80,110,150,.18) 23px 24px) 0 31px / 100% calc(100% - 31px) no-repeat,
    #fffaf0;
  box-shadow: 0 2px 5px rgba(0,0,0,.12);
  transition: transform .12s ease, box-shadow .12s ease;
}
.card-entry:hover { transform: translateY(-2px); box-shadow: 0 6px 12px rgba(0,0,0,.18); }
.card-entry .name { font-family: var(--display); font-weight: 700; font-size: 22px; line-height: 1.2; }
.card-entry .meta { font-size: 15px; color: var(--ink-soft); line-height: 24px; margin-top: 4px; }
.picker { max-height: 340px; overflow: auto; border: 1px solid var(--paper-edge); background: #fffaf0; border-radius: var(--radius); padding: 6px; columns: 2 260px; column-gap: 12px; }
.picker label { font-family: var(--serif); font-weight: 400; font-size: 16px; display: flex; gap: 8px; align-items: flex-start; padding: 3px 4px; margin: 0; break-inside: avoid; cursor: pointer; border-radius: 3px; }
.picker label:hover { background: rgba(0,0,0,.04); }
.picker input { margin-top: 5px; accent-color: var(--oxblood); }
.counter { font-family: var(--display); font-weight: 700; }
.counter.over { color: var(--danger); }

/* ---------- game ---------- */
.game-layout { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 22px; align-items: start; }
.game-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
.game-head h2 { margin-bottom: 4px; }
.board { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
.tile {
  position: relative; aspect-ratio: 3 / 4; overflow: hidden; cursor: pointer; padding: 0;
  border: 1px solid var(--paper-edge); border-radius: 3px; background: #fffaf0; text-align: center;
  box-shadow: 0 2px 4px rgba(0,0,0,.12); transition: transform .12s ease, box-shadow .12s ease;
}
.tile:hover { transform: translateY(-2px); box-shadow: 0 6px 12px rgba(0,0,0,.2); }
.tile .topic {
  position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding: 8px;
  font-family: var(--display); font-weight: 700; font-size: clamp(12px, 1.25vw, 17px); line-height: 1.15;
}
.tile img.cover { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.tile .nocover { position: absolute; inset: 0; background: linear-gradient(90deg, rgba(0,0,0,.25), rgba(255,255,255,.08) 30%, rgba(0,0,0,.2)), var(--navy); }
.tile .caption {
  position: absolute; left: 0; right: 0; bottom: 0; padding: 18px 6px 6px; text-align: left;
  background: linear-gradient(180deg, transparent, rgba(20,12,6,.88) 45%);
  color: var(--paper); font-size: clamp(11px, 1vw, 14px); line-height: 1.15;
}
.tile .caption b { display: block; font-weight: 600; }
.tile .caption i { opacity: .8; }
.tile .flag {
  position: absolute; top: 6px; right: 6px; padding: 0 6px; border-radius: 2px;
  font-family: var(--display); font-weight: 700; font-size: 12px; letter-spacing: .06em; text-transform: uppercase;
}
.tile.read .flag { background: var(--forest); color: var(--paper); }
.tile.planned { border: 2px dashed var(--ink-soft); }
.tile.planned img.cover, .tile.planned .nocover { opacity: .42; filter: grayscale(.6) sepia(.3); }
.tile.planned .flag { background: var(--paper); color: var(--ink-soft); border: 1px solid var(--ink-soft); }
.tile.planned .topic { align-items: flex-start; padding-top: 12px; }
.tile.read .topic { display: none; }
.tile.free { cursor: default; background: radial-gradient(circle at 50% 40%, #fff6dc, #ecd9a8); border: 1px solid var(--brass); }
.tile.free:hover { transform: none; box-shadow: 0 2px 4px rgba(0,0,0,.12); }
.tile.free .topic { flex-direction: column; gap: 2px; }
.free-mark { font-family: 'Abril Fatface', var(--display); font-weight: 400; font-size: clamp(16px, 2vw, 28px); color: var(--oxblood); letter-spacing: .04em; }
.free-sub { font-family: var(--display); font-size: clamp(10px, 1vw, 14px); text-transform: uppercase; letter-spacing: .14em; color: var(--ink-soft); }
.mini-board .free .noimg { background: #ecd9a8; color: var(--oxblood); font-weight: 700; letter-spacing: .05em; }
.tile.shelf { box-shadow: 0 0 0 3px var(--brass), 0 4px 10px rgba(0,0,0,.25); }
.legend { display: flex; gap: 18px; flex-wrap: wrap; margin-top: 12px; font-size: 15px; color: var(--ink-soft); }
.legend span::before { content: ''; display: inline-block; width: 12px; height: 12px; margin-right: 6px; vertical-align: -1px; border-radius: 2px; }
.legend .l-read::before { background: var(--forest); }
.legend .l-plan::before { border: 2px dashed var(--ink-soft); }
.legend .l-shelf::before { box-shadow: 0 0 0 2px var(--brass); }

aside .paper + .paper { margin-top: 18px; }
.code-box { display: flex; align-items: center; gap: 10px; margin-top: 6px; }
.code-box code { font-family: 'Abril Fatface', var(--display); font-size: 26px; letter-spacing: .14em; color: var(--oxblood); }
.players { list-style: none; margin: 0; padding: 0; }
.players li { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-bottom: 1px dotted var(--paper-edge); }
.players li:last-child { border-bottom: 0; }
.players .rank { width: 22px; text-align: center; font-family: var(--display); font-weight: 700; color: var(--ink-soft); }
.players .pname { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.players .pname small { display: block; color: var(--ink-soft); font-size: 14px; }
.players .me .pname { font-weight: 600; }
.shelf-count { display: flex; align-items: flex-end; gap: 6px; font-family: var(--display); font-weight: 700; font-size: 22px; }
.mini-books { display: inline-flex; align-items: flex-end; gap: 1px; height: 20px; }
.mini-books i { display: block; width: 5px; border-radius: 1px 1px 0 0; }

.others { margin-top: 28px; }
.others > h3 { color: var(--paper); margin-left: 4px; }
.others-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px; }
.other { padding: 16px; }
.other header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 10px; }
.other header b { font-family: var(--display); font-size: 20px; }
.mini-board { display: grid; grid-template-columns: repeat(5, 1fr); gap: 3px; }
.mini-board div { position: relative; aspect-ratio: 3 / 4; border-radius: 2px; overflow: hidden; background: #e4d6b5; border: 1px solid var(--paper-edge); }
.mini-board img { width: 100%; height: 100%; object-fit: cover; display: block; }
.mini-board .noimg { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding: 2px; background: var(--navy); color: var(--paper); font-size: 9px; line-height: 1.05; text-align: center; overflow: hidden; }
.mini-board .planned { border-style: dashed; border-color: var(--ink-soft); }
.mini-board .planned img, .mini-board .planned .noimg { opacity: .35; filter: grayscale(.6); }
.mini-board .shelf { box-shadow: 0 0 0 2px var(--brass); }

/* ---------- modal ---------- */
.overlay { position: fixed; inset: 0; background: rgba(15,9,5,.7); display: flex; align-items: flex-start; justify-content: center; padding: 6vh 16px 16px; z-index: 50; overflow: auto; }
.modal { width: 100%; max-width: 640px; position: relative; }
.modal .close { position: absolute; top: 10px; right: 12px; border: 0; background: none; font-size: 28px; line-height: 1; cursor: pointer; color: var(--ink-soft); }
.modal .eyebrow { font-family: var(--display); font-weight: 700; text-transform: uppercase; letter-spacing: .1em; font-size: 13px; color: var(--oxblood); }
.results { list-style: none; margin: 10px 0 0; padding: 0; max-height: 46vh; overflow: auto; }
.results li button { display: flex; gap: 12px; width: 100%; text-align: left; padding: 8px; border: 0; border-bottom: 1px dotted var(--paper-edge); background: none; cursor: pointer; align-items: center; }
.results li button:hover { background: rgba(0,0,0,.05); }
.results img, .results .ph { width: 42px; height: 62px; object-fit: cover; flex: none; border-radius: 2px; background: var(--navy); box-shadow: 0 1px 3px rgba(0,0,0,.3); }
.results .t { font-weight: 600; line-height: 1.2; }
.results .a { font-size: 15px; color: var(--ink-soft); }
.book-detail { display: flex; gap: 18px; margin: 10px 0 16px; }
.book-detail img, .book-detail .ph { width: 120px; height: 180px; object-fit: cover; flex: none; border-radius: 2px; background: var(--navy); box-shadow: 0 4px 10px rgba(0,0,0,.35); }
.book-detail h3 { margin-bottom: 2px; }
.book-detail .desc { font-size: 16px; line-height: 1.45; margin-top: 8px; max-height: 190px; overflow: auto; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; }

/* ---------- gamemaster ---------- */
.gm-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 22px; align-items: start; }
.list { list-style: none; margin: 0; padding: 0; max-height: 520px; overflow: auto; }
.list li { display: flex; align-items: center; gap: 10px; padding: 6px 2px; border-bottom: 1px dotted var(--paper-edge); }
.list li span { flex: 1; }

/* ---------- version token ---------- */
#version {
  position: fixed; left: 14px; bottom: 14px; z-index: 40; cursor: pointer;
  padding: 4px 12px; border-radius: 2px; border: 1px solid #8a6a32;
  background: linear-gradient(180deg, #f1dfae, #d7bd7c); color: #3a2a12;
  font-family: var(--display); font-weight: 700; font-size: 15px; letter-spacing: .05em;
  box-shadow: 0 3px 8px rgba(0,0,0,.45);
}
.history { list-style: none; padding: 0; margin: 0; }
.history li { padding: 10px 0; border-bottom: 1px dotted var(--paper-edge); }
.history li b { font-family: var(--display); font-size: 19px; }

.toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--paper); padding: 8px 18px; border-radius: var(--radius); z-index: 60; box-shadow: var(--shadow); }

@media (max-width: 1000px) {
  .game-layout { grid-template-columns: 1fr; }
  .others-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  /* minmax(0, 1fr), not 1fr: a column can't grow to fit its widest row (a reader with five buttons), so the page doesn't widen. */
  .gm-grid { grid-template-columns: minmax(0, 1fr); }
  .gm-grid .list li { flex-wrap: wrap; row-gap: 6px; }
}
@media (max-width: 640px) {
  body { font-size: 17px; }
  header.top { --s: .4; }
  body.auth-mode header.top { --s: .62; }
  nav.userbar .who { flex-basis: 100%; }
  .paper { padding: 16px; }
  .board { gap: 4px; }
  .tile .topic { font-size: 10px; padding: 3px; }
  .tile .caption { font-size: 9px; padding: 10px 3px 3px; }
  .tile .flag { font-size: 8px; top: 3px; right: 3px; padding: 0 3px; }
  .others-grid { grid-template-columns: 1fr; }
  .book-detail { flex-direction: column; }
  /* A reader can have up to five buttons: the name gets its own line and the buttons wrap beneath it. */
  .gm-grid .readers li > span { flex-basis: 100%; }
  /* Too many tabs for the screen? The row scrolls sideways inside itself instead of widening the whole page. */
  .tabs { overflow-x: auto; -webkit-overflow-scrolling: touch; scrollbar-width: thin; scrollbar-color: rgba(232,207,143,.4) transparent; }
  .tabs button { flex: none; white-space: nowrap; }
  .tabs button:focus-visible { outline-offset: -3px; } /* inside the button: the scroller would clip a ring drawn outside */
}
@media (max-width: 340px) {
  body.auth-mode header.top { --s: .54; } /* the sign-in title is a few pixels too wide for 320px screens */
}
</style>
</head>
<body>
<header class="top">
  <a class="shelf-title" href="#/" aria-label="Bookworm, home">
    <h1 id="title"></h1>
    <div class="plank"></div>
  </a>
  <nav class="userbar" id="userbar" hidden></nav>
</header>
<main id="app"></main>
<button id="version" type="button" title="Version history">v…</button>

<script>
'use strict';
const $ = (sel, root = document) => root.querySelector(sel);
const app = $('#app');
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
let me = null;
let pollTimer = null;

// ---------- title shelf ----------
const SPINES = [
  ['B', '#7a2e2a', 112, 54], ['O', '#2f5140', 100, 50], ['O', '#26375a', 117, 52], ['K', '#b08227', 104, 56, '#2a1c0a'],
  ['W', '#5a2f4f', 119, 62], ['O', '#2c5a5f', 98, 50], ['R', '#9a4a24', 110, 52], ['M', '#3b4430', 106, 58, null, true],
];
$('#title').innerHTML = SPINES.map(([l, c, h, w, t, lean]) =>
  `<span class="spine${lean ? ' lean' : ''}" style="--c:${c};--h:${h}px;--w:${w}px;${t ? `--t:${t};` : ''}">${l}</span>`).join('');

// ---------- api ----------
async function api(path, opts = {}) {
  const res = await fetch('/api' + path, {
    method: opts.method || 'GET',
    headers: opts.body ? { 'Content-Type': 'application/json' } : {},
    body: opts.body ? JSON.stringify(opts.body) : undefined,
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) {
    if (res.status === 401 && path !== '/login') { me = null; renderUserbar(); if (!location.hash.startsWith('#/login')) route(); }
    throw new Error(data.error || 'Something went wrong');
  }
  return data;
}
function toast(msg) {
  const t = document.createElement('div');
  t.className = 'toast'; t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 2600);
}
function fmtDate(s) {
  const [y, m, d] = s.split('-').map(Number);
  return new Date(y, m - 1, d).toLocaleDateString(undefined, { day: 'numeric', month: 'short', year: 'numeric' });
}
function isoDate(d) { return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; }
const LINES = (() => {
  const L = [];
  for (let r = 0; r < 5; r++) L.push([0, 1, 2, 3, 4].map((c) => r * 5 + c));
  for (let c = 0; c < 5; c++) L.push([0, 1, 2, 3, 4].map((r) => r * 5 + c));
  L.push([0, 6, 12, 18, 24], [4, 8, 12, 16, 20]);
  return L;
})();
function shelfPositions(player) {
  const read = (p) => player.order[p] === null || player.squares[player.order[p]]?.status === 'read';
  const set = new Set();
  LINES.filter((l) => l.every(read)).forEach((l) => l.forEach((p) => set.add(p)));
  return set;
}
// The 12 books a full shelf holds, as [colour, height, width]. Each reader gets them in their own order,
// seeded by their id so a reader's shelf looks the same on every refresh and every screen.
const SHELF_BOOKS = [
  ['#7a2e2a', 18, 5], ['#2f5140', 15, 6], ['#26375a', 20, 5], ['#b08227', 16, 6], ['#5a2f4f', 19, 5], ['#2c5a5f', 14, 6],
  ['#9a4a24', 17, 5], ['#3b4430', 20, 6], ['#8a6d3b', 15, 5], ['#4b2a2a', 18, 6], ['#2f3f4f', 16, 5], ['#6b7a3a', 19, 5],
];
const shelfOrders = new Map();
function shelfOrder(seed) {
  if (!shelfOrders.has(seed)) {
    let h = 2166136261; for (const ch of String(seed)) h = Math.imul(h ^ ch.charCodeAt(0), 16777619);
    const rand = () => ((h = Math.imul(h ^ (h >>> 15), 2246822507) ^ Math.imul(h ^ (h >>> 13), 3266489909)) >>> 0) / 4294967296;
    const order = SHELF_BOOKS.map((_, i) => i);
    for (let i = order.length - 1; i > 0; i--) { const j = Math.floor(rand() * (i + 1)); [order[i], order[j]] = [order[j], order[i]]; }
    shelfOrders.set(seed, order);
  }
  return shelfOrders.get(seed);
}
function miniBooks(n, seed) {
  const order = shelfOrder(seed);
  return `<span class="mini-books" aria-hidden="true">${order.slice(0, Math.min(n, 12)).map((b) => {
    const [c, h, w] = SHELF_BOOKS[b];
    return `<i style="background:${c};height:${h}px;width:${w}px"></i>`;
  }).join('')}</span>`;
}

// ---------- modal ----------
function openModal(html, { onClose } = {}) {
  closeModal();
  const ov = document.createElement('div');
  ov.className = 'overlay'; ov.id = 'overlay';
  ov.innerHTML = `<div class="modal paper" role="dialog" aria-modal="true"><button class="close" aria-label="Close">×</button>${html}</div>`;
  ov.addEventListener('mousedown', (e) => { if (e.target === ov) closeModal(); });
  $('.close', ov).onclick = closeModal;
  ov._onClose = onClose;
  document.body.appendChild(ov);
  return $('.modal', ov);
}
function closeModal() {
  const ov = $('#overlay');
  if (ov) { ov.remove(); ov._onClose?.(); }
}
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeModal(); });

// ---------- version token ----------
let versionInfo = null;
fetch('/version.json', { cache: 'no-cache' }).then((r) => r.json()).then((v) => {
  versionInfo = v;
  $('#version').textContent = v.version;
}).catch(() => {});
$('#version').onclick = () => {
  if (!versionInfo) return;
  openModal(`<p class="eyebrow">Colophon</p><h2>Version history</h2>
    <ul class="history">${versionInfo.history.map((h) => `<li><b>${esc(h.version)}</b> <span class="muted small">${esc(h.date)}</span>
      <ul class="small">${h.notes.map((n) => `<li>${esc(n)}</li>`).join('')}</ul></li>`).join('')}</ul>`);
};

// ---------- userbar ----------
function renderUserbar() {
  const bar = $('#userbar');
  if (!me) { bar.hidden = true; bar.innerHTML = ''; return; }
  bar.hidden = false;
  const role = me.isMaster ? 'Master' : me.isKeeper ? 'Keeper' : me.isGM ? 'GM' : '';
  bar.innerHTML = `<span class="who">Reading as <b>${esc(me.username)}</b>${role ? `<span class="role">${role}</span>` : ''}</span>
    <div class="navlinks">
      <a class="btn ghost sm" href="#/">Games</a>
      ${me.isGM ? '<a class="btn ghost sm" href="#/gm">GM</a>' : ''}
      <button class="btn ghost sm" id="chpw">Password</button>
      <button class="btn ghost sm" id="logout">Sign out</button>
    </div>`;
  $('#chpw').onclick = openChangePassword;
  $('#logout').onclick = async () => { await api('/logout', { method: 'POST' }).catch(() => {}); me = null; renderUserbar(); location.hash = '#/login'; };
}

function openChangePassword() {
  const modal = openModal(`<p class="eyebrow">Your account</p><h2>Change password</h2>
    <form id="pwForm">
      <div class="field"><label for="cur">Current password</label><input type="password" id="cur" autocomplete="current-password" required></div>
      <div class="field"><label for="npw">New password</label><input type="password" id="npw" autocomplete="new-password" minlength="6" required></div>
      <div class="field"><label for="npw2">New password again</label><input type="password" id="npw2" autocomplete="new-password" required></div>
      <p class="error" id="err"></p>
      <button class="btn primary" type="submit">Change password</button>
    </form>`);
  $('#cur', modal).focus();
  $('#pwForm', modal).onsubmit = async (e) => {
    e.preventDefault();
    if ($('#npw', modal).value !== $('#npw2', modal).value) { $('#err', modal).textContent = "The new passwords don't match"; return; }
    try {
      await api('/me/password', { method: 'POST', body: { current: $('#cur', modal).value, password: $('#npw', modal).value } });
      closeModal(); toast('Password changed');
    } catch (err) { $('#err', modal).textContent = err.message; }
  };
}
function tempPassword() {
  const words = ['quill', 'folio', 'shelf', 'spine', 'ink', 'vellum', 'chapter', 'margin', 'index', 'atlas', 'novel', 'fable'];
  const pick = () => words[crypto.getRandomValues(new Uint32Array(1))[0] % words.length];
  return `${pick()}-${pick()}-${100 + (crypto.getRandomValues(new Uint32Array(1))[0] % 900)}`;
}
function openResetPassword(id, name) {
  const modal = openModal(`<p class="eyebrow">GM</p><h2>Reset ${esc(name)}'s password</h2>
    <p class="muted small">They'll be signed out everywhere. Give them the new password so they can sign in, then they can change it under <b>Password</b>.</p>
    <form id="rpForm">
      <div class="field"><label for="rpw">New password</label>
        <div class="row" style="flex-wrap:nowrap"><input type="text" id="rpw" minlength="6" required autocomplete="off" value="${esc(tempPassword())}">
        <button type="button" class="btn sm" id="regen" title="Suggest another">New</button></div></div>
      <p class="error" id="err"></p>
      <button class="btn primary" type="submit">Reset password</button>
    </form>`);
  $('#regen', modal).onclick = () => { $('#rpw', modal).value = tempPassword(); };
  $('#rpForm', modal).onsubmit = async (e) => {
    e.preventDefault();
    const pw = $('#rpw', modal).value;
    try {
      await api(`/users/${id}/password`, { method: 'POST', body: { password: pw } });
      modal.innerHTML = `<button class="close" aria-label="Close">×</button><p class="eyebrow">Done</p><h2>Password reset</h2>
        <p>${esc(name)}'s new password is:</p><p class="code-box"><code style="letter-spacing:.04em">${esc(pw)}</code></p>
        <p class="muted small">This is the only time it's shown.</p>`;
      $('.close', modal).onclick = closeModal;
    } catch (err) { $('#err', modal).textContent = err.message; }
  };
}

// ---------- router ----------
async function route() {
  clearInterval(pollTimer); pollTimer = null;
  closeModal();
  const hash = location.hash || '#/';
  document.body.classList.toggle('auth-mode', !me);
  if (!me) return renderAuth(hash === '#/register' ? 'register' : 'login');
  if (hash === '#/login' || hash === '#/register') { location.hash = '#/'; return; }
  const m = hash.match(/^#\/game\/([\w-]+)/);
  if (m) return renderGame(m[1]);
  if (hash === '#/gm' && me.isGM) return renderGM();
  const tab = (hash.match(/^#\/(create|join|view|friends|library)$/) || [])[1] || 'view';
  return renderLobby(tab);
}
async function loadFriends() {
  try { return await api('/friends'); } catch { return { friends: [], incoming: [], outgoing: [] }; }
}
window.addEventListener('hashchange', route);

// ---------- auth ----------
function renderAuth(mode) {
  const reg = mode === 'register';
  app.innerHTML = `<section class="auth paper">
    <p class="eyebrow" style="font-family:var(--display);font-weight:700;letter-spacing:.1em;text-transform:uppercase;font-size:13px;color:var(--oxblood);margin:0 0 4px">Library card</p>
    <h2>${reg ? 'Get a library card' : 'Sign in'}</h2>
    <p class="muted small">${reg ? 'Make an account to start or join a reading bingo.' : 'Welcome back to the stacks.'}</p>
    <form id="authForm">
      <div class="field"><label for="u">Username</label><input type="text" id="u" autocomplete="username" required></div>
      <div class="field"><label for="p">Password</label><input type="password" id="p" autocomplete="${reg ? 'new-password' : 'current-password'}" required></div>
      <p class="error" id="err"></p>
      <button class="btn primary" type="submit">${reg ? 'Create account' : 'Sign in'}</button>
    </form>
    <p class="switch">${reg ? 'Already have a card? <a href="#/login">Sign in</a>' : 'New here? <a href="#/register">Get a library card</a>'}</p>
  </section>`;
  $('#u').focus();
  $('#authForm').onsubmit = async (e) => {
    e.preventDefault();
    try {
      const { user } = await api(reg ? '/register' : '/login', { method: 'POST', body: { username: $('#u').value, password: $('#p').value } });
      me = user; renderUserbar();
      if (reg && user.isMaster) toast('You are the master account.');
      location.hash = '#/'; route();
    } catch (err) { $('#err').textContent = err.message; }
  };
}

// ---------- lobby: create / join / view ----------
async function renderLobby(tab) {
  const [fr, { invites }] = await Promise.all([loadFriends(), api('/invites').catch(() => ({ invites: [] }))]);
  const badge = (n) => (n ? `<span class="badge">${n}</span>` : '');
  const tabs = [['view', 'View games', badge(invites.length)], ['create', 'Create a game', ''], ['join', 'Join a game', ''], ['friends', 'Friends', badge(fr.incoming.length)], ['library', 'Library', '']];
  app.innerHTML = `<div class="tabs" role="tablist">${tabs.map(([k, l, b]) =>
    `<button role="tab" aria-selected="${k === tab}" data-tab="${k}">${l}${b}</button>`).join('')}</div>
    <section class="paper tabpanel" id="panel"></section>`;
  app.querySelectorAll('[data-tab]').forEach((b) => (b.onclick = () => (location.hash = '#/' + b.dataset.tab)));
  // The bar is rebuilt on every tab change; on a narrow screen it scrolls, so bring the chosen tab back into view.
  const bar = $('.tabs', app), cur = $('[aria-selected=true]', bar);
  if (cur) bar.scrollLeft += cur.getBoundingClientRect().left - bar.getBoundingClientRect().left - (bar.clientWidth - cur.offsetWidth) / 2;
  const panel = $('#panel');
  if (tab === 'view') return renderView(panel, invites);
  if (tab === 'create') return renderCreate(panel);
  if (tab === 'friends') return renderFriends(panel, fr);
  if (tab === 'library') return renderLibrary(panel, fr);
  return renderJoin(panel);
}

// The Library: finished games. Readers see their own card and friends' cards; Gamemasters can switch to every archive.
let libraryScope = 'mine';
async function renderLibrary(panel, fr) {
  if (!me.isGM) libraryScope = 'mine';
  panel.innerHTML = '<p class="muted">Fetching the archives…</p>';
  let games;
  try { ({ games } = await api('/library' + (libraryScope === 'all' ? '?scope=all' : ''))); }
  catch (err) { panel.innerHTML = `<p class="error">${esc(err.message)}</p>`; return; }
  const friendIds = new Set(fr.friends.map((f) => f.id));
  panel.innerHTML = `<div class="lib-head">
      <div><h2>Library</h2><p class="muted small" style="margin:0">${libraryScope === 'all'
        ? 'Every finished game, with every reader\'s card.'
        : 'Finished games you played, with your card and your friends\' cards.'}</p></div>
      <div class="lib-tools">
        ${me.isGM ? `<div class="seg" role="group" aria-label="Library scope">
          <button data-scope="mine" aria-pressed="${libraryScope === 'mine'}">My library</button>
          <button data-scope="all" aria-pressed="${libraryScope === 'all'}">All archives</button></div>` : ''}
        <input type="search" id="libSearch" placeholder="Search games or readers" aria-label="Search games or readers">
      </div>
    </div>
    <div id="libList">${games.length ? games.map((g) => {
      const mineCard = g.players.find((p) => p.id === me.id);
      const rest = g.players.filter((p) => p.id !== me.id);
      const search = [g.name, g.creator, ...g.players.map((p) => p.username)].join(' ').toLowerCase();
      return `<details class="archive" data-search="${esc(search)}">
        <summary>
          <span class="a-name">${esc(g.name)}</span>
          <span class="muted small">${fmtDate(g.start)} – ${fmtDate(g.end)} · ${g.playerCount} reader${g.playerCount === 1 ? '' : 's'}
            ${mineCard ? ` · you: ${mineCard.read} read, ${mineCard.shelves} shel${mineCard.shelves === 1 ? 'f' : 'ves'}` : ''}
            ${g.leaders.length ? ` · most shelves: ${esc(g.leaders.join(', '))} (${g.topShelves})` : ''}</span>
        </summary>
        <div class="others-grid" style="margin-top:14px">
          ${mineCard ? otherHTML(mineCard, g.tiles, ' <span class="muted small">(you)</span>') : ''}
          ${rest.map((p) => otherHTML(p, g.tiles, friendIds.has(p.id) ? ' <span class="stamp active" style="font-size:11px">Friend</span>' : '')).join('')}
        </div>
        ${libraryScope === 'mine' && g.playerCount > g.players.length ? `<p class="muted small" style="margin:10px 0 0">${g.playerCount - g.players.length} other reader${g.playerCount - g.players.length === 1 ? '' : 's'} in this game ${g.playerCount - g.players.length === 1 ? 'isn\'t' : 'aren\'t'} on your friends list.</p>` : ''}
      </details>`;
    }).join('') : `<p class="muted">${libraryScope === 'all' ? 'No games have finished yet.' : 'No finished games yet — once a game\'s end date passes, it moves here.'}</p>`}</div>
    <p class="muted" id="libNone" hidden>No archives match that search.</p>`;
  panel.querySelectorAll('[data-scope]').forEach((b) => (b.onclick = () => { libraryScope = b.dataset.scope; renderLibrary(panel, fr); }));
  $('#libSearch', panel).oninput = (e) => {
    const q = e.target.value.trim().toLowerCase();
    let shown = 0;
    panel.querySelectorAll('.archive').forEach((d) => { const hit = !q || d.dataset.search.includes(q); d.hidden = !hit; shown += hit; });
    $('#libNone', panel).hidden = !games.length || shown > 0;
  };
}

function renderFriends(panel, fr) {
  const row = (u, buttons) => `<li><span>${esc(u.username)}</span>${buttons}</li>`;
  panel.innerHTML = `<h2>Friends</h2>
    <p class="muted small">Add friends from the readers list inside any game you share. Friends can invite each other to games.</p>
    ${fr.incoming.length ? `<h3>Friend requests</h3><ul class="list" style="margin-bottom:18px">${fr.incoming.map((u) => row(u,
      `<button class="btn green sm" data-accept="${esc(u.id)}">Accept</button><button class="btn ghost sm" data-drop="${esc(u.id)}">Decline</button>`)).join('')}</ul>` : ''}
    <h3>Your friends</h3>
    ${fr.friends.length ? `<ul class="list">${fr.friends.map((u) => row(u, `<button class="btn ghost sm" data-drop="${esc(u.id)}" data-confirm="Remove ${esc(u.username)} from your friends?">Remove</button>`)).join('')}</ul>`
      : '<p class="muted">No friends yet.</p>'}
    ${fr.outgoing.length ? `<h3 style="margin-top:18px">Waiting on</h3><ul class="list">${fr.outgoing.map((u) => row(u, `<button class="btn ghost sm" data-drop="${esc(u.id)}">Cancel request</button>`)).join('')}</ul>` : ''}`;
  panel.onclick = async (e) => {
    const b = e.target.closest('button'); if (!b) return;
    try {
      if (b.dataset.accept) await api(`/friends/${b.dataset.accept}/accept`, { method: 'POST' });
      else if (b.dataset.drop) {
        if (b.dataset.confirm && !confirm(b.dataset.confirm)) return;
        await api('/friends/' + b.dataset.drop, { method: 'DELETE' });
      } else return;
      renderLobby('friends');
    } catch (err) { toast(err.message); }
  };
}

async function renderView(panel, invites = []) {
  panel.innerHTML = '<p class="muted">Pulling the catalogue drawer…</p>';
  const { games } = await api('/games');
  const inviteHTML = invites.length ? `<div class="invite-strip"><h3>Invitations</h3><ul class="list">${invites.map((i) => `<li>
      <span><b>${esc(i.name)}</b> <span class="muted small">from ${esc(i.from)} · ${fmtDate(i.start)} – ${fmtDate(i.end)} · ${i.playerCount} reader${i.playerCount === 1 ? '' : 's'}</span></span>
      <button class="btn green sm" data-join="${esc(i.gameId)}">Join</button><button class="btn ghost sm" data-decline="${esc(i.gameId)}">Decline</button>
    </li>`).join('')}</ul></div>` : '';
  panel.onclick = async (e) => {
    const b = e.target.closest('button[data-join], button[data-decline]'); if (!b) return;
    try {
      if (b.dataset.join) { await api(`/invites/${b.dataset.join}/accept`, { method: 'POST' }); location.hash = '#/game/' + b.dataset.join; }
      else { await api('/invites/' + b.dataset.decline, { method: 'DELETE' }); renderLobby('view'); }
    } catch (err) { toast(err.message); }
  };
  if (!games.length) {
    panel.innerHTML = `${inviteHTML}<h2>Your games</h2><p class="muted">You aren't in any games yet. <a href="#/create">Create one</a> or <a href="#/join">join with a code</a>.</p>`;
    return;
  }
  panel.innerHTML = `${inviteHTML}<h2>${me.isMaster ? 'All games' : 'Your games'}</h2><div class="catalog">${games.map((g) => `
    <button class="card-entry" data-id="${esc(g.id)}">
      <div class="name">${esc(g.name)}</div>
      <div class="meta"><span class="stamp ${g.status}">${g.status}</span> &nbsp;${fmtDate(g.start)} – ${fmtDate(g.end)}</div>
      <div class="meta">${g.playerCount} reader${g.playerCount === 1 ? '' : 's'}${g.isMember ? ` · your shelves: ${g.myShelves}` : ' · not playing'}</div>
    </button>`).join('')}</div>`;
  panel.querySelectorAll('[data-id]').forEach((b) => (b.onclick = () => (location.hash = '#/game/' + b.dataset.id)));
}

async function renderCreate(panel) {
  const { tiles } = await api('/tiles');
  const start = new Date(); const end = new Date(); end.setMonth(end.getMonth() + 3);
  panel.innerHTML = `<h2>Create a game</h2>
    <form id="createForm">
      <div class="row">
        <div class="field" style="flex:2 1 260px"><label for="gname">Game name</label><input type="text" id="gname" maxlength="60" placeholder="Winter Reading Challenge" required></div>
        <div class="field"><label for="gstart">Starts</label><input type="date" id="gstart" value="${isoDate(start)}" required></div>
        <div class="field"><label for="gend">Ends</label><input type="date" id="gend" value="${isoDate(end)}" required></div>
      </div>
      <div class="field">
        <label>Tiles from the library <span class="muted small" style="font-weight:400">— pick up to 24 (the middle is a free space); any left over are drawn at random</span></label>
        <div class="picker" id="picker">${tiles.map((t) => `<label><input type="checkbox" value="${esc(t.id)}"> ${esc(t.text)}</label>`).join('')}</div>
      </div>
      <div class="field">
        <label for="custom">Your own tiles <span class="muted small" style="font-weight:400">— one per line</span></label>
        <textarea id="custom" rows="4" placeholder="A book set in our hometown&#10;A book with a dragon on the cover"></textarea>
      </div>
      <p><span class="counter" id="counter"></span></p>
      <p class="error" id="err"></p>
      <button class="btn primary" type="submit">Create game</button>
    </form>`;
  const count = () => {
    const n = panel.querySelectorAll('#picker input:checked').length + $('#custom').value.split('\n').filter((l) => l.trim()).length;
    const c = $('#counter');
    c.textContent = n > 24 ? `${n} tiles chosen — remove ${n - 24}` : `${n} of 24 chosen${n < 24 ? ` · ${24 - n} will be drawn at random` : ''} · plus the free space`;
    c.classList.toggle('over', n > 24);
  };
  panel.addEventListener('input', count); count();
  $('#createForm').onsubmit = async (e) => {
    e.preventDefault();
    try {
      const { game } = await api('/games', { method: 'POST', body: {
        name: $('#gname').value, start: $('#gstart').value, end: $('#gend').value,
        tileIds: [...panel.querySelectorAll('#picker input:checked')].map((i) => i.value),
        custom: $('#custom').value.split('\n'),
      } });
      location.hash = '#/game/' + game.id;
    } catch (err) { $('#err').textContent = err.message; }
  };
}

function renderJoin(panel) {
  panel.innerHTML = `<h2>Join a game</h2>
    <p class="muted">Ask someone in the game for its code — they'll find it on the game's page.</p>
    <form id="joinForm" style="max-width:360px">
      <div class="field"><label for="code">Game code</label><input type="text" id="code" maxlength="12" autocomplete="off" style="text-transform:uppercase;letter-spacing:.15em;font-size:22px" required></div>
      <p class="error" id="err"></p>
      <button class="btn primary" type="submit">Join</button>
    </form>`;
  $('#code').focus();
  $('#joinForm').onsubmit = async (e) => {
    e.preventDefault();
    try {
      const { game } = await api('/games/join', { method: 'POST', body: { code: $('#code').value } });
      location.hash = '#/game/' + game.id;
    } catch (err) { $('#err').textContent = err.message; }
  };
}

// ---------- game ----------
let game = null;
let friendState = { friends: [], incoming: [], outgoing: [] };
async function renderGame(id) {
  app.innerHTML = '<p style="color:var(--paper)">Opening the book…</p>';
  try { [{ game }, friendState] = await Promise.all([api('/games/' + id), loadFriends()]); }
  catch (err) { app.innerHTML = `<section class="paper"><h2>Game not found</h2><p>${esc(err.message)}</p><a class="btn" href="#/">Back to games</a></section>`; return; }
  drawGame();
  pollTimer = setInterval(async () => {
    if ($('#overlay')) return;
    try { [{ game }, friendState] = await Promise.all([api('/games/' + id), loadFriends()]); drawGame(); } catch {}
  }, 15000);
}

// The button beside another reader in the list: add, accept, pending, or already friends.
// Each state has a full label and a one-character compact label; fitReaders() swaps to the compact one
// on any row where the name no longer fits beside the shelf.
function friendButton(p) {
  const has = (list) => list.some((u) => u.id === p.id);
  const lbl = (full, short) => `<span class="full">${full}</span><span class="short" aria-hidden="true">${short}</span>`;
  if (has(friendState.friends)) return `<span class="stamp active friend-btn" title="Friend">${lbl('Friend', '★')}</span>`;
  if (has(friendState.incoming)) return `<button class="btn green sm friend-btn" data-befriend="${esc(p.id)}" title="Accept friend request" aria-label="Accept friend request">${lbl('Accept', '✓')}</button>`;
  if (has(friendState.outgoing)) return `<span class="muted small friend-btn" title="Friend request sent">${lbl('Requested', '…')}</span>`;
  return `<button class="btn ghost sm friend-btn" data-befriend="${esc(p.id)}" title="Send a friend request" aria-label="Send a friend request">${lbl('+ Friend', '+')}</button>`;
}
function fitReaders() {
  document.querySelectorAll('.players li').forEach((li) => {
    li.classList.remove('compact');
    const name = li.querySelector('.pname');
    if (li.querySelector('.friend-btn') && name && name.scrollWidth > name.clientWidth + 1) li.classList.add('compact');
  });
}
window.addEventListener('resize', fitReaders);

function openInvite() {
  const invitable = friendState.friends.filter((f) => !game.players.some((p) => p.id === f.id));
  const modal = openModal(`<p class="eyebrow">${esc(game.name)}</p><h2>Invite friends</h2>
    ${!friendState.friends.length ? `<p class="muted">You don't have any friends yet. Add readers you share a game with from the readers list, or share the game code <b>${esc(game.code)}</b>.</p>`
      : !invitable.length ? '<p class="muted">All your friends are already in this game.</p>'
      : `<p class="muted small">They'll see the invitation on their games page.</p>
        <label class="small" style="font-weight:400;display:flex;gap:8px;align-items:center;font-family:var(--serif)"><input type="checkbox" id="all"> Select all</label>
        <div class="checklist" id="friendList">${invitable.map((f) => `<label><input type="checkbox" value="${esc(f.id)}"> ${esc(f.username)}</label>`).join('')}</div>
        <p class="error" id="err"></p>
        <button class="btn primary" id="sendInvites" disabled>Send invitations</button>`}`);
  const list = $('#friendList', modal); if (!list) return;
  const boxes = () => [...list.querySelectorAll('input')];
  const update = () => {
    const n = boxes().filter((b) => b.checked).length;
    $('#sendInvites', modal).disabled = !n;
    $('#sendInvites', modal).textContent = n ? `Send ${n} invitation${n === 1 ? '' : 's'}` : 'Send invitations';
    $('#all', modal).checked = n === boxes().length;
  };
  list.addEventListener('change', update);
  $('#all', modal).onchange = (e) => { boxes().forEach((b) => (b.checked = e.target.checked)); update(); };
  $('#sendInvites', modal).onclick = async () => {
    try {
      const { sent } = await api(`/games/${game.id}/invite`, { method: 'POST', body: { userIds: boxes().filter((b) => b.checked).map((b) => b.value) } });
      closeModal(); toast(sent ? `Sent ${sent} invitation${sent === 1 ? '' : 's'}` : 'They were already invited');
    } catch (err) { $('#err', modal).textContent = err.message; }
  };
}

function drawGame() {
  const mine = game.players.find((p) => p.id === me.id);
  const others = game.players.filter((p) => p.id !== me.id);
  const ranked = [...game.players].sort((a, b) => b.shelves - a.shelves || b.read - a.read || a.username.localeCompare(b.username));
  const canDelete = game.creatorId === me.id || me.isMaster;
  const statusNote = { active: 'In progress', upcoming: `Starts ${fmtDate(game.start)} — plan your picks`, ended: 'This game has ended' }[game.status];

  app.innerHTML = `<div class="game-layout">
    <section class="paper">
      <div class="game-head">
        <div>
          <h2>${esc(game.name)}</h2>
          <div class="muted small"><span class="stamp ${game.status}">${game.status}</span> &nbsp;${fmtDate(game.start)} – ${fmtDate(game.end)} · ${esc(statusNote)}</div>
        </div>
        <div class="actions">
          ${mine && !canDelete ? '<button class="btn ghost sm" id="leave">Leave game</button>' : ''}
          ${canDelete ? '<button class="btn danger sm" id="delete">Delete game</button>' : ''}
        </div>
      </div>
      ${mine ? `<div class="board" id="board">${boardHTML(mine)}</div>
        <div class="legend"><span class="l-read">Read</span><span class="l-plan">Planned</span><span class="l-shelf">Part of a shelf (bingo)</span></div>`
        : '<p class="muted">You are viewing this game as the master account and are not playing in it.</p>'}
      ${mine && !others.length && game.status !== 'ended' ? `<div class="empty-invite">
        <h3>It's just you so far</h3>
        <p class="muted small" style="margin-top:0">Invite friends to this game, or share the code <b>${esc(game.code)}</b>.</p>
        <button class="btn primary invite-btn">Invite friends</button></div>` : ''}
    </section>
    <aside>
      <div class="paper">
        <h3>Game code</h3>
        <div class="code-box"><code>${esc(game.code)}</code><button class="btn sm" id="copy">Copy</button></div>
        <p class="muted small" style="margin:6px 0 10px">Share it so others can join.</p>
        ${mine && game.status !== 'ended' ? '<button class="btn green sm invite-btn">Invite friends</button>' : ''}
      </div>
      <div class="paper">
        <h3>Readers</h3>
        <ul class="players">${ranked.map((p, i) => `<li class="${p.id === me.id ? 'me' : ''}">
          <span class="rank">${i + 1}</span>
          <span class="pname" title="${esc(p.username)}">${esc(p.username)}${p.id === me.id ? ' (you)' : ''}<small>${p.read} read · ${p.planned} planned</small></span>
          <span class="shelf-count" title="${p.shelves} shelves (bingos)">${miniBooks(p.shelves, p.id)}${p.shelves}</span>
          ${mine && p.id !== me.id ? friendButton(p) : ''}
        </li>`).join('')}</ul>
        <p class="muted small" style="margin:8px 0 0">A <b>shelf</b> is a full row, column or diagonal of books read.</p>
      </div>
    </aside>
  </div>
  ${others.length ? `<section class="others"><h3>Other readers' cards</h3>
    <div class="others-grid">${others.map((p) => otherHTML(p)).join('')}</div></section>` : ''}`;

  if (mine) $('#board').querySelectorAll('.tile[data-tile]').forEach((t) => (t.onclick = () => openTile(Number(t.dataset.tile))));
  fitReaders();
  app.querySelectorAll('.invite-btn').forEach((b) => (b.onclick = openInvite));
  app.querySelectorAll('[data-befriend]').forEach((b) => (b.onclick = async () => {
    try {
      const { status } = await api('/friends/' + b.dataset.befriend, { method: 'POST' });
      friendState = await loadFriends(); drawGame();
      toast(status === 'friends' ? "You're now friends" : 'Friend request sent');
    } catch (err) { toast(err.message); }
  }));
  $('#copy').onclick = () => navigator.clipboard?.writeText(game.code).then(() => toast('Code copied'), () => toast(game.code));
  $('#leave') && ($('#leave').onclick = async () => {
    if (!confirm('Leave this game? Your card will be removed.')) return;
    await api(`/games/${game.id}/leave`, { method: 'POST' }); location.hash = '#/';
  });
  $('#delete') && ($('#delete').onclick = async () => {
    if (!confirm(`Delete "${game.name}" for everyone? This can't be undone.`)) return;
    await api(`/games/${game.id}`, { method: 'DELETE' }); toast('Game deleted'); location.hash = '#/';
  });
}

function boardHTML(player) {
  const lit = shelfPositions(player);
  return player.order.map((tileId, pos) => {
    if (tileId === null) return `<div class="tile free${lit.has(pos) ? ' shelf' : ''}" aria-label="Free space" title="Free space — counts as read"><span class="topic"><span class="free-mark">Free</span><span class="free-sub">space</span></span></div>`;
    const tile = game.tiles[tileId];
    const sq = player.squares[tileId];
    const cls = ['tile', sq?.status, lit.has(pos) ? 'shelf' : ''].filter(Boolean).join(' ');
    const label = `${tile.text}${sq ? ` — ${sq.status}: ${sq.book.title}` : ''}`;
    return `<button class="${cls}" data-tile="${tileId}" aria-label="${esc(label)}" title="${esc(label)}">
      ${sq ? (sq.book.cover ? `<img class="cover" src="${esc(sq.book.cover)}" alt="" loading="lazy">` : '<span class="nocover"></span>') : ''}
      <span class="topic">${esc(tile.text)}</span>
      ${sq ? `<span class="flag">${sq.status === 'read' ? 'Read' : 'Planned'}</span>
        <span class="caption"><b>${esc(sq.book.title)}</b>${sq.book.author ? `<i>${esc(sq.book.author)}</i>` : ''}</span>` : ''}
    </button>`;
  }).join('');
}

function otherHTML(p, tiles = game.tiles, tag = '') {
  const lit = shelfPositions(p);
  return `<article class="paper other">
    <header><b>${esc(p.username)}${tag}</b><span class="shelf-count" style="font-size:18px">${miniBooks(p.shelves, p.id)}${p.shelves}</span></header>
    <div class="mini-board">${p.order.map((tileId, pos) => {
      if (tileId === null) return `<div class="free${lit.has(pos) ? ' shelf' : ''}" title="Free space"><span class="noimg">FREE</span></div>`;
      const sq = p.squares[tileId]; const tile = tiles[tileId];
      const tip = `${tile.text}${sq ? ` — ${sq.status}: ${sq.book.title}${sq.book.author ? ' by ' + sq.book.author : ''}` : ''}`;
      const cls = [sq?.status === 'planned' ? 'planned' : '', lit.has(pos) ? 'shelf' : ''].filter(Boolean).join(' ');
      const inner = sq ? (sq.book.cover ? `<img src="${esc(sq.book.cover)}" alt="" loading="lazy">` : `<span class="noimg">${esc(sq.book.title)}</span>`) : '';
      return `<div class="${cls}" title="${esc(tip)}">${inner}</div>`;
    }).join('')}</div>
    <p class="muted small" style="margin:8px 0 0">${p.read} read · ${p.planned} planned</p>
  </article>`;
}

// The tile dialog: shows what's on the tile, and a search to pick a book to read or plan.
function openTile(tileId) {
  const tile = game.tiles[tileId];
  const mine = game.players.find((p) => p.id === me.id);
  const sq = mine.squares[tileId];
  const locked = game.status === 'ended';
  const modal = openModal(`
    <p class="eyebrow">${tile.custom ? 'Custom tile' : 'Tile'}</p>
    <h2>${esc(tile.text)}</h2>
    <div id="current"></div>
    ${locked ? '<p class="muted">This game has ended, so cards can no longer change.</p>' : `
      <div class="field" style="margin-top:8px"><label for="q">Find a book</label>
        <input type="search" id="q" placeholder="Title, author or ISBN" autocomplete="off"></div>
      <p class="muted small" id="searchNote">Search the Open Library catalogue.</p>
      <ul class="results" id="results"></ul>`}`);
  const current = $('#current', modal);
  if (sq) {
    current.innerHTML = bookDetailHTML(sq.book, sq.status === 'read' ? 'Read' : 'Planned') +
      (locked ? '' : `<div class="actions">
        ${sq.status === 'planned' ? `<button class="btn green" id="markRead" ${game.status !== 'active' ? 'disabled title="The game has not started yet"' : ''}>I've read it</button>` : ''}
        <button class="btn danger" id="clear">Clear tile</button></div><hr style="border:0;border-top:1px dotted var(--paper-edge);margin:18px 0 8px">`);
    $('#markRead', modal) && ($('#markRead', modal).onclick = () => setSquare(tileId, 'read', sq.book));
    $('#clear', modal) && ($('#clear', modal).onclick = () => { if (confirm(`Clear "${sq.book.title}" from this tile?`)) setSquare(tileId, null); });
  }
  if (locked) return;
  const q = $('#q', modal); const results = $('#results', modal); const note = $('#searchNote', modal);
  if (!sq) q.focus();
  let timer, seq = 0, found = [];
  q.addEventListener('input', () => {
    clearTimeout(timer);
    const term = q.value.trim();
    if (term.length < 2) { results.innerHTML = ''; note.textContent = 'Search the Open Library catalogue.'; return; }
    timer = setTimeout(async () => {
      const mySeq = ++seq;
      note.textContent = 'Searching…';
      try {
        ({ books: found } = await api('/books/search?q=' + encodeURIComponent(term)));
        if (mySeq !== seq) return;
        note.textContent = found.length ? 'Pick a book:' : 'Nothing found — try another spelling.';
        results.innerHTML = found.map((b, i) => `<li><button data-i="${i}">
          ${b.cover ? `<img src="${esc(b.cover.replace('-M.', '-S.'))}" alt="" loading="lazy">` : '<span class="ph"></span>'}
          <span><span class="t">${esc(b.title)}</span><br><span class="a">${esc(b.author || 'Unknown author')}${b.year ? ` · ${b.year}` : ''}</span></span>
        </button></li>`).join('');
      } catch (err) { if (mySeq === seq) note.textContent = err.message; }
    }, 350);
  });
  results.addEventListener('click', async (e) => {
    const btn = e.target.closest('[data-i]'); if (!btn) return;
    const book = { ...found[Number(btn.dataset.i)], description: '' };
    current.innerHTML = bookDetailHTML(book, 'Selected', true) + `<div class="actions">
      <button class="btn green" id="doRead" ${game.status !== 'active' ? 'disabled title="You can log finished books once the game starts"' : ''}>I've read it</button>
      <button class="btn" id="doPlan">Plan to read</button></div>
      <hr style="border:0;border-top:1px dotted var(--paper-edge);margin:18px 0 8px">`;
    $('#doRead', modal).onclick = () => setSquare(tileId, 'read', book);
    $('#doPlan', modal).onclick = () => setSquare(tileId, 'planned', book);
    modal.parentElement.scrollTop = 0;
    try {
      const { description } = await api('/books/description?key=' + encodeURIComponent(book.key));
      book.description = description;
      const d = $('.desc', current);
      if (d) d.textContent = description || 'No description in the catalogue.';
    } catch { const d = $('.desc', current); if (d) d.textContent = 'No description in the catalogue.'; }
  });
}

function bookDetailHTML(b, label, loading) {
  return `<div class="book-detail">
    ${b.cover ? `<img src="${esc(b.cover.replace('-S.', '-M.'))}" alt="Cover of ${esc(b.title)}">` : '<span class="ph"></span>'}
    <div style="min-width:0">
      <p class="eyebrow" style="margin:0 0 4px">${esc(label)}</p>
      <h3>${esc(b.title)}</h3>
      <div class="muted">${esc(b.author || 'Unknown author')}${b.year ? ` · ${b.year}` : ''}</div>
      <div class="desc">${loading ? '<i class="muted">Fetching description…</i>' : esc(b.description || 'No description in the catalogue.')}</div>
    </div></div>`;
}

async function setSquare(tileId, status, book) {
  try {
    ({ game } = await api(`/games/${game.id}/squares/${tileId}`, { method: 'POST', body: { status, book } }));
    closeModal(); drawGame();
    const mine = game.players.find((p) => p.id === me.id);
    if (status === 'read') toast(mine.shelves ? `Logged! You have ${mine.shelves} shel${mine.shelves === 1 ? 'f' : 'ves'}.` : 'Logged!');
  } catch (err) { toast(err.message); }
}

// ---------- gamemaster ----------
async function renderGM() {
  const [{ tiles }, { users }] = await Promise.all([api('/tiles'), api('/users')]);
  app.innerHTML = `<div class="gm-grid">
    <section class="paper">
      <h2>Tile library</h2>
      <p class="muted small">These are the tiles players can choose from when creating a game. Removing one doesn't change games already made.</p>
      <form id="tileForm" class="row" style="align-items:flex-end;margin-bottom:12px">
        <div class="field" style="margin:0;flex:1 1 240px"><label for="tileText">New tile</label><input type="text" id="tileText" maxlength="80" placeholder="A book with a train on the cover" required></div>
        <button class="btn primary" type="submit">Add</button>
      </form>
      <p class="error" id="tileErr"></p>
      <p class="muted small">${tiles.length} tiles</p>
      <ul class="list">${tiles.map((t) => `<li><span>${esc(t.text)}</span><button class="btn danger sm" data-del="${esc(t.id)}">Remove</button></li>`).join('')}</ul>
    </section>
    <section class="paper">
      <h2>Readers</h2>
      <p class="muted small">GMs can promote readers to GM. Keepers can also reset the passwords of readers and GMs.${me.isMaster ? ' As master you alone can make Keepers, demote, remove accounts, and reset Keeper passwords.' : ''}</p>
      <ul class="list readers">${users.map((u) => `<li><span>${esc(u.username)} ${u.isMaster ? '<span class="stamp active">Master</span>' : u.isKeeper ? '<span class="stamp keeper">Keeper</span>' : u.isGM ? '<span class="stamp upcoming">GM</span>' : ''}</span>
        ${!u.isGM ? `<button class="btn sm" data-promote="${esc(u.id)}">Make GM</button>` : ''}
        ${me.isMaster && !u.isKeeper ? `<button class="btn sm" data-keeper="${esc(u.id)}">Make Keeper</button>` : ''}
        ${me.isKeeper && (!u.isKeeper || me.isMaster) ? `<button class="btn ghost sm" data-resetpw="${esc(u.id)}" data-name="${esc(u.username)}">Reset password</button>` : ''}
        ${me.isMaster && u.isGM && !u.isMaster ? `<button class="btn ghost sm" data-demote="${esc(u.id)}" title="${u.isKeeper ? 'Back to GM' : 'Back to reader'}">Demote</button>` : ''}
        ${me.isMaster && !u.isMaster ? `<button class="btn danger sm" data-remove="${esc(u.id)}" data-name="${esc(u.username)}">Remove</button>` : ''}
      </li>`).join('')}</ul>
    </section>
  </div>`;
  $('#tileForm').onsubmit = async (e) => {
    e.preventDefault();
    try { await api('/tiles', { method: 'POST', body: { text: $('#tileText').value } }); renderGM(); }
    catch (err) { $('#tileErr').textContent = err.message; }
  };
  app.onclick = async (e) => {
    if (location.hash !== '#/gm') return;
    const b = e.target.closest('button'); if (!b) return;
    try {
      if (b.dataset.del) await api('/tiles/' + b.dataset.del, { method: 'DELETE' });
      else if (b.dataset.promote) await api(`/users/${b.dataset.promote}/promote`, { method: 'POST' });
      else if (b.dataset.keeper) await api(`/users/${b.dataset.keeper}/keeper`, { method: 'POST' });
      else if (b.dataset.resetpw) { openResetPassword(b.dataset.resetpw, b.dataset.name); return; }
      else if (b.dataset.demote) await api(`/users/${b.dataset.demote}/demote`, { method: 'POST' });
      else if (b.dataset.remove) {
        if (!confirm(`Remove ${b.dataset.name}'s account and their cards in every game?`)) return;
        await api('/users/' + b.dataset.remove, { method: 'DELETE' });
      } else return;
      renderGM();
    } catch (err) { toast(err.message); }
  };
}

// ---------- boot ----------
api('/me').then(({ user }) => { me = user; renderUserbar(); route(); }).catch(() => route());
</script>
</body>
</html>
